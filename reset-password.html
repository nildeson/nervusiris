<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar Senha — Nervus Iris</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body class="login-body">

  <div class="login-card">
    <div class="login-header">
      <div class="login-icone">🔑</div>
      <h1 id="tituloTela">Recuperar Senha</h1>
      <p id="subtituloTela">Enviaremos um link para o seu e-mail.</p>
    </div>

    <!-- FORM 1: PEDIR E-MAIL -->
    <form id="formPedirEmail">
      <label>
        Seu e-mail cadastrado
        <input type="email" id="recEmail" required placeholder="seu@email.com" />
      </label>
      <div id="msgErro1" class="login-erro"></div>
      <button type="submit" class="btn-primario btn-full">Enviar Link</button>
    </form>

    <!-- FORM 2: NOVA SENHA (Escondido inicialmente) -->
    <form id="formNovaSenha" class="escondido" style="margin-top: 20px;">
      <label>
        Nova Senha
        <input type="password" id="recNovaSenha" required minlength="6" placeholder="Mínimo 6 caracteres" />
      </label>
      <div id="msgErro2" class="login-erro"></div>
      <button type="submit" class="btn-primario btn-full">Salvar Nova Senha</button>
    </form>

    <div class="login-footer">
      <a href="login.html">← Voltar para o login</a>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
